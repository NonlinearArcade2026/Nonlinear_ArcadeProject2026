<!-- File: index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RABBIT SHOOTING LIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #3b2a4a;
      --pink: #ff8fb8;
      --yellow: #ffe066;
      --mint: #7ee0c3;
      --sky: #8ecbff;
      --cream: #fff6e9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 16px 48px;
      min-height: 100vh;
      color: var(--ink);
      font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
      background-color: var(--cream);
      background-image:
        radial-gradient(#ffd1e3 18%, transparent 19%),
        radial-gradient(#d7f5ec 18%, transparent 19%);
      background-size: 48px 48px;
      background-position: 0 0, 24px 24px;
      overflow-x: hidden;
    }

    /* ===== ヘッダー ===== */
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    #logo {
      max-height: 80px;
      max-width: 60vw;
    }
    .mascot {
      width: 64px;
      height: 64px;
      object-fit: contain;
      animation: hop 1.6s ease-in-out infinite;
    }
    .mascot-fallback {
      font-size: 48px;
      animation: hop 1.6s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 3.2rem);
      font-weight: 800;
      letter-spacing: .04em;
      color: #fff;
      -webkit-text-stroke: 3px var(--ink);
      paint-order: stroke fill;
      text-shadow: 4px 4px 0 var(--pink);
      transform: rotate(-2deg);
    }
    #status {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 14px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: #fff;
      font-weight: 800;
      font-size: .85rem;
    }
    #status.live {
      background: var(--mint);
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* ===== セクション見出し ===== */
    h2 {
      display: inline-block;
      margin: 28px 0 14px;
      padding: 6px 18px;
      font-size: 1.1rem;
      font-weight: 800;
      background: var(--yellow);
      border: 3px solid var(--ink);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--ink);
      transform: rotate(-1.5deg);
    }
    section { max-width: 960px; margin: 0 auto; }

    /* ===== 最新プレイヤーカード ===== */
    #latest {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 28px 18px;
      padding-top: 28px;
    }
    .card {
      position: relative;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 24px;
      box-shadow: 6px 6px 0 var(--ink);
      text-align: center;
      padding: 0 12px 14px;
    }
    /* うさ耳 */
    .card::before,
    .card::after {
      content: "";
      position: absolute;
      top: -36px;
      width: 26px;
      height: 48px;
      background: var(--c);
      border: 4px solid var(--ink);
      border-radius: 50% 50% 40% 40%;
      z-index: -1;
    }
    .card::before { left: 28%; transform: rotate(-12deg); }
    .card::after  { right: 28%; transform: rotate(12deg); }
    .band {
      margin: 0 -12px 10px;
      padding: 6px 0;
      background: var(--c);
      border-bottom: 4px solid var(--ink);
      border-radius: 19px 19px 0 0;
      font-weight: 800;
      font-size: .9rem;
      color: var(--ink);
    }
    .card .name {
      font-weight: 800;
      font-size: 1.15rem;
      word-break: break-all;
    }
    .card .score {
      margin: 6px 0;
      font-size: 2.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(transparent 62%, var(--yellow) 62%);
      display: inline-block;
      padding: 0 4px;
    }
    .card .rank {
      display: inline-block;
      padding: 2px 10px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 800;
      background: var(--sky);
    }
    .card .rank.out { background: #eee; }
    .card .rank.top { background: var(--pink); }
    .card.enter {
      animation: boing .8s cubic-bezier(.2, 1.6, .4, 1) both;
      animation-delay: var(--d);
    }

    /* ===== 歴代ランキング ===== */
    #history {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }
    #history li {
      display: grid;
      grid-template-columns: 3.2em 14px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    #history .pos { text-align: center; font-size: 1.1rem; }
    #history .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--c);
      border: 2px solid var(--ink);
    }
    #history .pname { word-break: break-all; }
    #history li.me {
      background: var(--yellow);
      box-shadow: 4px 4px 0 var(--pink);
    }
    #history li.me .pname::after { content: " ← NEW!"; color: #ff4f8b; }
    #history li.me.flash { animation: wiggle .5s ease-in-out 4; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      font-weight: 800;
      opacity: .6;
    }

    /* ===== NEW RECORD バナー ===== */
    #record {
      position: fixed;
      top: 40%;
      left: 50%;
      z-index: 20;
      padding: 14px 28px;
      font-size: clamp(1.6rem, 7vw, 3rem);
      font-weight: 800;
      color: #fff;
      background: #ff4f8b;
      border: 5px solid var(--ink);
      border-radius: 24px;
      box-shadow: 8px 8px 0 var(--ink);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.2);
    }
    #record.show { animation: record 2.8s ease-out; }

    /* ===== 紙吹雪 ===== */
    .confetti {
      position: fixed;
      top: -20px;
      z-index: 10;
      width: 12px;
      height: 16px;
      border-radius: 3px;
      pointer-events: none;
      animation: fall var(--t) linear forwards;
    }

    /* ===== キーフレーム ===== */
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }
    @keyframes boing {
      from { opacity: 0; transform: translateY(60px) scale(.6) rotate(-6deg); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25%      { transform: rotate(-1.5deg) scale(1.02); }
      75%      { transform: rotate(1.5deg) scale(1.02); }
    }
    @keyframes record {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-10deg); }
      15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
      25%  { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
      85%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
    @keyframes fall {
      to { transform: translate(var(--x), 110vh) rotate(var(--r)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <!-- images/rabbit.png があれば表示し、無ければ絵文字にする -->
      <img class="mascot" src="images/rabbit.png" alt=""
           onerror="this.outerHTML='<span class=&quot;mascot-fallback&quot;>🐰</span>'">
      <!-- images/logo.png があればロゴ画像、無ければ文字タイトル -->
      <img id="logo" src="images/logo.png" alt="RABBIT SHOOTING"
           onerror="this.outerHTML='<h1>RABBIT SHOOTING</h1>'">
      <span class="mascot-fallback" aria-hidden="true">🥕</span>
    </div>
    <div><span id="status">せつぞく中…</span></div>
  </header>

  <section>
    <h2>🎯 LATEST GAME</h2>
    <div id="latest"><p class="empty">まだデータがないよ！</p></div>
  </section>

  <section>
    <h2>🏆 ALL-TIME RANKING</h2>
    <ol id="history"></ol>
  </section>

  <div id="record">🎉 NEW RECORD! 🎉</div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $latest = document.getElementById("latest");
    const $history = document.getElementById("history");
    const $status = document.getElementById("status");
    const $record = document.getElementById("record");
    let lastId = null;

    const POP_COLORS = ["#ff8fb8", "#ffe066", "#7ee0c3", "#8ecbff", "#c9a7ff", "#ffb36b"];
    const MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
    const safeColor = (c) => /^[0-9A-Fa-f]{6}$/.test(c) ? `#${c}` : "#ffffff";
    const num = (v) => Number(v) || 0;

    function countUp(el, target, duration = 1200) {
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(target * eased).toLocaleString();
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function confetti(count = 60) {
      for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = POP_COLORS[i % POP_COLORS.length];
        piece.style.setProperty("--t", `${2 + Math.random() * 1.5}s`);
        piece.style.setProperty("--x", `${(Math.random() - 0.5) * 200}px`);
        piece.style.setProperty("--r", `${Math.random() * 720}deg`);
        piece.style.animationDelay = `${Math.random() * 0.5}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4500);
      }
    }

    function showRecord() {
      $record.classList.remove("show");
      void $record.offsetWidth; // アニメーションをリセットする
      $record.classList.add("show");
    }

    function rankChip(rank) {
      if (rank <= 0) return `<span class="rank out">ランク外</span>`;
      const cls = rank <= 3 ? "rank top" : "rank";
      return `<span class="${cls}">歴代 ${rank} 位 ${MEDALS[rank] ?? ""}</span>`;
    }

    function render(snapshot, animate) {
      const latest = snapshot?.latest ?? [];
      const history = snapshot?.history ?? [];

      $latest.innerHTML = latest.length === 0
        ? `<p class="empty">まだデータがないよ！</p>`
        : latest.map((p, i) => `
          <div class="card ${animate ? "enter" : ""}"
               style="--c:${safeColor(p.color)};--d:${i * 0.15}s">
            <div class="band">PLAYER ${i + 1}</div>
            <div class="name">${esc(p.name)}</div>
            <div class="score" data-score="${num(p.score)}">
              ${animate ? "0" : num(p.score).toLocaleString()}
            </div>
            <div>${rankChip(num(p.rank))}</div>
          </div>`).join("");

      $history.innerHTML = history.length === 0
        ? `<li class="empty">まだ記録がないよ！</li>`
        : history.map((p) => `
          <li class="${p.isLatest ? "me" : ""} ${p.isLatest && animate ? "flash" : ""}"
              style="--c:${safeColor(p.color)}">
            <span class="pos">${MEDALS[p.rank] ?? p.rank}</span>
            <span class="dot"></span>
            <span class="pname">${esc(p.name)}</span>
            <span>${num(p.score).toLocaleString()}</span>
          </li>`).join("");

      if (animate) {
        $latest.querySelectorAll(".score").forEach((el, i) => {
          setTimeout(() => countUp(el, num(el.dataset.score)), i * 150 + 400);
        });
        confetti();
        if (latest.some((p) => num(p.rank) === 1)) {
          setTimeout(showRecord, 600);
        }
      }
    }

    async function fetchLatest() {
      const { data, error } = await supabase
        .from("snapshots")
        .select("id, payload")
        .order("id", { ascending: false })
        .limit(1)
        .maybeSingle();

      if (error) {
        console.error(error);
        return;
      }
      if (data && data.id !== lastId) {
        const isUpdate = lastId !== null;
        lastId = data.id;
        render(data.payload, isUpdate);
      }
    }

    supabase
      .channel("snapshots-live")
      .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "snapshots" },
        (payload) => {
          lastId = payload.new.id;
          render(payload.new.payload, true);
        })
      .subscribe((status) => {
        const live = status === "SUBSCRIBED";
        $status.textContent = live ? "● LIVE中！" : "せつぞく中…";
        $status.classList.toggle("live", live);
        if (live) fetchLatest(); // 再接続時に、切断中の更新を取り直す
      });

    // スマホがスリープから復帰したときにも取り直す
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchLatest();
    });

    fetchLatest();
  </script>
</body>
</html>
