    /* ===== ヘッダー ===== */
    header { text-align: center; margin: 48px 0 8px; }
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 100%;

    .logo-img { max-height: 90px; max-width: 72vw; }
    .mascot-img {

    .emoji {

      display: inline-block;
      animation: hop 1.6s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-family: var(--font-title), "M PLUS Rounded 1c", sans-serif;
      font-size: clamp(1.7rem, 8vw, 3.2rem);
      font-weight: 800;
      letter-spacing: .04em;
      line-height: 1.15;
      color: #fff;
      -webkit-text-stroke: 3px var(--ink);
      paint-order: stroke fill;
      text-shadow: 4px 4px 0 var(--pink);
      transform: rotate(-2deg);
    }
    #status {
      display: inline-block;
      max-width: 92vw;
      margin-top: 10px;
      padding: 4px 14px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: #fff;
      font-weight: 800;
      font-size: .85rem;
      overflow-wrap: anywhere;
    }
    #status.live { background: var(--mint); animation: pulse 1.4s ease-in-out infinite; }
    #status.error { background: #ffd0d0; }

    /* ===== セクション見出し ===== */
    section { max-width: 960px; margin: 0 auto; }
    h2 {
      display: inline-block;
      margin: 28px 0 14px;
      padding: 6px 18px;
      font-family: var(--font-title), var(--font-main), sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      background: var(--yellow);
      border: 3px solid var(--ink);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--ink);

      padding-top: 30px;

      min-width: 0;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 24px;
      box-shadow: 6px 6px 0 var(--ink);
      text-align: center;
      padding: 0 12px 14px;

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      top: -36px;
      width: 26px;
      height: 48px;
      background: var(--c);
      border: 4px solid var(--ink);
      border-radius: 50% 50% 40% 40%;
      z-index: -1;

    .card::before { left: 28%; transform: rotate(-12deg); }
    .card::after  { right: 28%; transform: rotate(12deg); }

      margin: 0 -12px 10px;
      padding: 6px 0;

      border-radius: 19px 19px 0 0;
      font-weight: 800;
      font-size: .9rem;

      font-weight: 800;
      font-size: 1.15rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card .score {
      display: inline-block;
      max-width: 100%;
      margin: 6px 0;
      padding: 0 4px;
      font-family: var(--font-title), var(--font-main), sans-serif;
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(transparent 62%, var(--yellow) 62%);

    .card .rank {
      display: inline-block;
      padding: 2px 10px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 800;
      background: var(--sky);
    }
    .card .rank.out { background: #eee; }
    .card .rank.top { background: var(--pink); }
    .card.enter {
      animation: boing .8s cubic-bezier(.2, 1.6, .4, 1) both;
      animation-delay: var(--d);
    }

    /* ===== 歴代ランキング ===== */
    #history {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }
    #history li {
      display: grid;
      grid-template-columns: 3.2em 14px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    #history .pos { text-align: center; font-size: 1.1rem; }
    #history .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--c);
      border: 2px solid var(--ink);

    #history .new-tag { margin-left: 6px; color: var(--hot); font-size: .8em; }
    #history li.me { background: var(--yellow); box-shadow: 4px 4px 0 var(--pink); }
    #history li.me.flash { animation: wiggle .5s ease-in-out 4; }
    .empty { grid-column: 1 / -1; text-align: center; font-weight: 800; opacity: .6; }

    .vote-bar {

      box-shadow: 0 6px 0 var(--ink);

      height: 96px;

      position: fixed;
      top: -20px;
      z-index: 35;
      width: 12px;
      height: 16px;
      border-radius: 3px;
      pointer-events: none;

      h1 { -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 3px 0 var(--pink); }
      h2 { font-size: .95rem; margin: 22px 0 10px; }
      #latest {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 34px 12px;
        padding-top: 26px;

      .card { border-width: 3px; border-radius: 18px; box-shadow: 4px 4px 0 var(--ink); padding: 0 8px 10px; }
      .card::before, .card::after { top: -28px; width: 20px; height: 38px; border-width: 3px; }
      .band { margin: 0 -8px 8px; border-bottom-width: 3px; border-radius: 15px 15px 0 0; font-size: .75rem; }
      .card .name { font-size: .95rem; }
      .card .rank { font-size: .7rem; padding: 2px 8px; }
      #history li { grid-template-columns: 2.2em 10px minmax(0, 1fr) auto; gap: 8px; padding: 7px 12px; font-size: .9rem; }
      #history .dot { width: 10px; height: 10px; }
      .vote-btn { min-height: 62px; padding: 8px 16px; gap: 10px; }
      .vote-icon { font-size: 1.6rem; }
    }

    /* ===== 大きい画面 ===== */
    @media (min-width: 1400px) {
      html { font-size: 20px; }
      section { max-width: 1280px; }

    @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes boing {
      from { opacity: 0; transform: translateY(60px) scale(.6) rotate(-6deg); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-1.5deg) scale(1.02); }
      75% { transform: rotate(1.5deg) scale(1.02); }
    }
    @keyframes nudge {
      0%, 86%, 100% { transform: translateY(0); }
      90% { transform: translateY(-6px); }
      94% { transform: translateY(0); }
      97% { transform: translateY(-3px); }
    }
    @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
    @keyframes cheer {
      0%, 100% { transform: scale(1) rotate(0); }
      30% { transform: scale(1.06) rotate(-2deg); }
      60% { transform: scale(1.06) rotate(2deg); }
    }
    @keyframes record {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-10deg); }
      15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
      25%  { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
      85%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
    @keyframes fall { to { transform: translate(var(--x), 110vh) rotate(var(--r)); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }

        scanToVote: "휴대폰으로 스캔해서 투표하세요!"
      },
      es: {
        label: "Español", connecting: "Conectando…", live: "● ¡EN VIVO!",
        latest: "ÚLTIMA PARTIDA", ranking: "RANKING HISTÓRICO",
        noData: "¡Aún no hay datos!", noRecord: "¡Aún no hay récords!",
        player: "JUGADOR {n}", rank: "Puesto #{n}", outOfRank: "Sin puesto",
        newTag: "¡NUEVO!", newRecord: "🎉 ¡NUEVO RÉCORD! 🎉",
        vote: "¡Vota por este proyecto!", voteSub: "Ir a la página del Festival de Komaba",
        scanToVote: "¡Escanea con tu móvil para votar!"
      },
      fr: {
        label: "Français", connecting: "Connexion…", live: "● EN DIRECT !",
        latest: "DERNIÈRE PARTIE", ranking: "CLASSEMENT GÉNÉRAL",
        noData: "Pas encore de données !", noRecord: "Pas encore de records !",
        player: "JOUEUR {n}", rank: "Rang n°{n}", outOfRank: "Non classé",
        newTag: "NOUVEAU !", newRecord: "🎉 NOUVEAU RECORD ! 🎉",
        vote: "Votez pour ce projet !", voteSub: "Page du festival de Komaba",
        scanToVote: "Scannez avec votre téléphone pour voter !"
      }
    };

    const supabase = createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
    const params = new URLSearchParams(location.search);
    const isDisplayMode = params.get("mode") === "display";
    const withVersion = (src) => `${src}${src.includes("?") ? "&" : "?"}v=${CONFIG.assetVersion}`;

    // ============================================================
    // フォント読み込み
    // ============================================================
    const loadedFonts = new Set();

    function loadFont(font) {
      if (!font) return;
      const id = font.url ?? font.file;
      if (!id || loadedFonts.has(id)) return;
      loadedFonts.add(id);

      if (font.url) {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = font.url;
        document.head.appendChild(link);
      } else if (font.file) {
        const style = document.createElement("style");
        style.textContent = `
          @font-face {
            font-family: "${font.family}";
            src: url("${withVersion(font.file)}");
            font-weight: 100 900;
            font-display: swap;
          }`;
        document.head.appendChild(style);
      }
    }

    function applyFonts(lang) {
      const body = CONFIG.fonts[lang] ?? CONFIG.fonts.ja;
      loadFont(body);
      loadFont(CONFIG.titleFont);
      const root = document.documentElement.style;
      root.setProperty("--font-main", `"${body.family}"`);
      root.setProperty("--font-title", `"${CONFIG.titleFont?.family ?? body.family}"`);
    }

    // ============================================================
    // 画像の読み込み（無いときは代わりの表示を出し、Console に警告する）
    // ============================================================
    function mountImage(slot, src, className, alt, fallbackHtml) {
      slot.innerHTML = fallbackHtml;
      if (!src) return;
      const img = new Image();
      img.className = className;
      img.alt = alt;
      img.onload = () => slot.replaceChildren(img);
      img.onerror = () => console.warn(`[画像] 見つかりません: ${src}（場所・ファイル名・大文字小文字を確認）`);
      img.src = withVersion(src);
    }

    function setupImages() {
      const im = CONFIG.images;
      mountImage(document.getElementById("slot-mascot"), im.mascot, "mascot-img", "",
        `<span class="emoji" aria-hidden="true">🐰</span>`);
      mountImage(document.getElementById("slot-logo"), im.logo, "logo-img", "RABBIT SHOOTING",
        `<h1>RABBIT SHOOTING</h1>`);

      if (im.background) {
        const bg = document.getElementById("bg");
        bg.style.backgroundImage = `url("${withVersion(im.background)}")`;
        bg.style.opacity = String(im.backgroundOpacity ?? 0.35);
      }

      if (isDisplayMode && im.voteQr) {
        const qr = document.getElementById("vote-qr");
        qr.onload = () => $vote.classList.add("has-qr");
        qr.onerror = () => console.warn(`[画像] 投票QRが見つかりません: ${im.voteQr}`);
        qr.src = withVersion(im.voteQr);
      }
    }

    // ============================================================
    // 言語
    // ============================================================
    const LANG_KEY = "rabbit-lang";

    function normalizeLang(code) {
      if (!code) return null;
      const c = code.toLowerCase();
      if (c.startsWith("zh")) return /(hant|tw|hk|mo)/.test(c) ? "zh-Hant" : "zh-Hans";
      const base = c.split("-")[0];
      return I18N[base] ? base : null;
    }

    function detectLang() {
      const fromUrl = normalizeLang(params.get("lang"));
      if (fromUrl) return fromUrl;
      const saved = normalizeLang(localStorage.getItem(LANG_KEY));
      if (saved) return saved;
      for (const l of navigator.languages ?? [navigator.language]) {
        const n = normalizeLang(l);
        if (n) return n;
      }
      return "ja";
    }

    let currentLang = detectLang();
    const t = (key, n) => (I18N[currentLang][key] ?? I18N.ja[key] ?? key).replace("{n}", n);

    // ============================================================
    // 画面要素
    // ============================================================
    const $latest = document.getElementById("latest");
    const $history = document.getElementById("history");
    const $status = document.getElementById("status");
    const $record = document.getElementById("record");
    const $lang = document.getElementById("lang");
    const $vote = document.getElementById("vote");
    let lastId = null;
    let lastSnapshot = null;
    let isLive = false;
    let lastError = null;

    const POP_COLORS = ["#ff8fb8", "#ffe066", "#7ee0c3", "#8ecbff", "#c9a7ff", "#ffb36b"];
    const MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
    const safeColor = (c) => /^[0-9A-Fa-f]{6}$/.test(c) ? `#${c}` : "#ffffff";
    const num = (v) => Number(v) || 0;
    const fmt = (v) => num(v).toLocaleString(currentLang);

    $vote.href = CONFIG.voteUrl;

    for (const [code, dict] of Object.entries(I18N)) {
      const opt = document.createElement("option");
      opt.value = code;
      opt.textContent = dict.label;
      $lang.appendChild(opt);
    }
    $lang.addEventListener("change", (e) => setLang(e.target.value));

    function setLang(lang) {
      currentLang = I18N[lang] ? lang : "ja";
      localStorage.setItem(LANG_KEY, currentLang);
      document.documentElement.lang = currentLang;
      $lang.value = currentLang;
      applyFonts(currentLang);

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      if (isDisplayMode) {
        document.querySelector(".vote-sub").textContent = t("scanToVote");
      }
      $record.textContent = t("newRecord");
      updateStatus();
      render(lastSnapshot, false);
    }

    function updateStatus() {
      $status.classList.toggle("live", isLive && !lastError);
      $status.classList.toggle("error", !!lastError);
      $status.textContent = lastError
        ? `⚠ ${lastError}`
        : (isLive ? t("live") : t("connecting"));
    }

    // ============================================================
    // 演出
    // ============================================================
    function countUp(el, target, duration = 1200) {
      const start = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - start) / duration);
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString(currentLang);
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function confetti() {
      const count = window.innerWidth < 520 ? 35 : 60;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = POP_COLORS[i % POP_COLORS.length];
        piece.style.setProperty("--t", `${2 + Math.random() * 1.5}s`);
        piece.style.setProperty("--x", `${(Math.random() - 0.5) * 200}px`);
        piece.style.setProperty("--r", `${Math.random() * 720}deg`);
        piece.style.animationDelay = `${Math.random() * 0.5}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4500);
      }
    }

    function replayClass(el, cls) {
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    }

    function rankChip(rank) {
      if (rank <= 0) return `<span class="rank out">${t("outOfRank")}</span>`;
      const cls = rank <= 3 ? "rank top" : "rank";
      return `<span class="${cls}">${t("rank", rank)} ${MEDALS[rank] ?? ""}</span>`;
    }

    // ============================================================
    // 描画
    // ============================================================
    function render(snapshot, animate) {
      lastSnapshot = snapshot;
      const latest = snapshot?.latest ?? [];
      const history = snapshot?.history ?? [];

      $latest.innerHTML = latest.length === 0
        ? `<p class="empty">${t("noData")}</p>`
        : latest.map((p, i) => `
          <div class="card ${animate ? "enter" : ""}"
               style="--c:${safeColor(p.color)};--d:${i * 0.15}s">
            <div class="band">${t("player", i + 1)}</div>
            <div class="name" title="${esc(p.name)}">${esc(p.name)}</div>
            <div class="score" data-score="${num(p.score)}">${animate ? "0" : fmt(p.score)}</div>
            <div>${rankChip(num(p.rank))}</div>
          </div>`).join("");

      $history.innerHTML = history.length === 0
        ? `<li class="empty">${t("noRecord")}</li>`
        : history.map((p) => `
          <li class="${p.isLatest ? "me" : ""} ${p.isLatest && animate ? "flash" : ""}"
              style="--c:${safeColor(p.color)}">
            <span class="pos">${MEDALS[p.rank] ?? p.rank}</span>
            <span class="dot"></span>
            <span class="pname" title="${esc(p.name)}">${esc(p.name)}${p.isLatest ? `<span class="new-tag">${t("newTag")}</span>` : ""}</span>
            <span>${fmt(p.score)}</span>
          </li>`).join("");

      if (animate) {
        $latest.querySelectorAll(".score").forEach((el, i) => {
          setTimeout(() => countUp(el, num(el.dataset.score)), i * 150 + 400);
        });
        confetti();
        if (latest.some((p) => num(p.rank) === 1)) {
          setTimeout(() => replayClass($record, "show"), 600);
        }
        // 盛り上がったタイミングで投票ボタンを揺らす
        setTimeout(() => replayClass($vote, "cheer"), 3200);
      }
    }

    // ============================================================
    // データ取得とリアルタイム受信
    // ============================================================
    async function fetchLatest() {
      const { data, error } = await supabase
        .from("snapshots")
        .select("id, payload")
        .order("id", { ascending: false })
        .limit(1)
        .maybeSingle();

      if (error) {
        console.error(error);
        lastError = `${error.code ?? ""} ${error.message ?? "error"}`.trim();
        updateStatus();
        return;
      }
      lastError = null;
      updateStatus();

      if (data && data.id !== lastId) {
        const isUpdate = lastId !== null;
        lastId = data.id;
        render(data.payload, isUpdate);
      }
    }

    supabase
      .channel("snapshots-live")
      .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "snapshots" },
        (payload) => {
          lastId = payload.new.id;
          render(payload.new.payload, true);
        })
      .subscribe((status) => {
        isLive = status === "SUBSCRIBED";
        updateStatus();
        if (isLive) fetchLatest();
      });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchLatest();
    });

    // 万一リアルタイム通知が止まっても、30秒ごとに最新を確認する
    setInterval(fetchLatest, 30000);

    if (isDisplayMode) document.body.classList.add("display");
    setupImages();
    setLang(currentLang);
    fetchLatest();
  </script>
</body>
</html>
